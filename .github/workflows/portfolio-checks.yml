name: Portfolio checks
on:
  push:
    branches: [main, repair-video-storage, original-video-delivery, improve-original-playback, mobile-video-copies, reduce-resource-usage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install browser for mobile and desktop loading checks
        if: github.ref == 'refs/heads/reduce-resource-usage'
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Confirm no video requests before an explicit click and preserve draft sources
        if: github.ref == 'refs/heads/reduce-resource-usage'
        run: node scripts/check-lazy-video-browser.mjs
  production:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run smoke

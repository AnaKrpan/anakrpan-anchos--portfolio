<!doctype html>
<html lang="hr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Provjera pohrane videa</title>
<style>body{max-width:32rem;margin:3rem auto;padding:1rem;background:#f8f3ee;color:#342e28;font:18px/1.5 system-ui}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit}p{overflow-wrap:anywhere}</style>
<h1>Provjera pohrane videa</h1><p>Ova provjera ne mijenja tvoj portfolio ni postojeće videe.</p>
<form id="login"><label>Lozinka za uređivanje portfolija<input id="password" type="password" autocomplete="current-password" required></label><button>Prijavi se</button></form>
<button id="check" hidden>Provjeri pohranu</button><p id="status" role="status" aria-live="polite"></p>
<script>
const status=document.querySelector('#status'),form=document.querySelector('#login'),button=document.querySelector('#check');
async function request(path,options={}){const r=await fetch(path,{...options,signal:AbortSignal.timeout(120000)});const d=await r.json();if(!r.ok)throw new Error((d.error||'Provjera nije uspjela.')+(d.trace?' Oznaka: '+d.trace:''));return d;}
form.addEventListener('submit',async e=>{e.preventDefault();try{await request('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});document.querySelector('#password').value='';form.hidden=true;button.hidden=false;status.textContent='Prijavljena si. Klikni „Provjeri pohranu”.';}catch(error){status.textContent=error.message;}});
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Provjeravam prijenos, originalne bajtove i dostavu…';try{const d=await request('/api/originals/check',{method:'POST'});if(!d.verified)throw new Error('Pohrana još nije potvrđena.');status.textContent='Provjera je uspjela. Pohrana je primila iste bajtove i ispravno ih dostavila. Postojeći portfolio nije mijenjan.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
request('/api/session').then(d=>{if(d.canEdit){form.hidden=true;button.hidden=false;}}).catch(()=>{});
</script></html>

<!doctype html>
<html lang="hr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Prijava za uređivanje — ANCHOS</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ef;color:#382f29;font:16px/1.6 Arial,sans-serif;padding:24px}main{width:min(100%,420px)}h1{font:44px/1.1 Georgia,serif;margin:0 0 24px}label{display:block}input{width:100%;padding:15px;border:1px solid #b4a291;background:#fff;font:inherit;border-radius:8px;margin:8px 0 20px}button{width:100%;padding:14px;border:0;border-radius:30px;background:#382f29;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.6}a{color:inherit}#status{min-height:1.6em}footer{margin-top:32px}</style>
</head>
<body><main><h1>Uredi svoj<br>ANCHOS portfolio</h1><p>Prijava je dostupna samo vlasnici portfolija.</p><form id="login"><label for="password">Tvoja lozinka za portfolio</label><input id="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit">Prijavi se</button><p id="status" role="alert"></p></form><footer><a href="/">Vrati se na portfolio</a></footer></main>
<script>
document.querySelector('#login').addEventListener('submit',async event=>{
  event.preventDefault();const button=document.querySelector('#submit'),status=document.querySelector('#status');button.disabled=true;status.textContent='Prijavljujem…';
  try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Prijava nije uspjela.');document.querySelector('#password').value='';location.href='/uredi';}
  catch(error){status.textContent=error.message;button.disabled=false;}
});
</script></body></html>
